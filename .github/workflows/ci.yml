name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/check-version-consistency.mjs
      - run: node scripts/check-release-safety.mjs

  pack-scan:
    runs-on: macos-latest # bsdtar is the leaky one; scan its output for real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: "*.tgz"
